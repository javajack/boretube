pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "boretube-agent"
include ':app'

// The learning engine, shared with boretube Learn.
includeBuild('../learn-core') {
    dependencySubstitution {
        substitute module('com.rakesh.boretube:learn-core') using project(':')
    }
}
