plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.rakesh.boretube_mobile"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.rakesh.boretube"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // local_auth_android and flutter_secure_storage need API 24+.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // One stable key for every build, so updates install over the app already
    // on the phone (a different key forces an uninstall). Keep it outside git;
    // override with BORETUBE_KEYSTORE. Falls back to the default debug key.
    def boretubeKey = file(System.getenv("BORETUBE_KEYSTORE") ?:
            "${System.getProperty('user.home')}/.boretube/keys/boretube2-debug.keystore")
    signingConfigs {
        debug {
            if (boretubeKey.exists()) {
                storeFile = boretubeKey
                storePassword = "android"
                keyAlias = "androiddebugkey"
                keyPassword = "android"
            }
        }
    }

    buildTypes {
        release {
            // Sideloaded family app: release uses the same stable key.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // AppCompat launch theme: local_auth's biometric prompt needs it on
    // Android 8 and below.
    implementation "androidx.appcompat:appcompat:1.7.0"
}
