plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

def keystorePropsFile = rootProject.file('keystore/keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.rakesh.boretube.agent'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rakesh.boretube.agent'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '1.2.0'
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-opt-in=kotlinx.serialization.ExperimentalSerializationApi']
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }
    androidResources {
        // The TV card font is mmapped straight from the APK.
        noCompress 'ttf'
    }
    buildFeatures {
        buildConfig true
    }
    lint {
        // Deliberately no activity / LEANBACK_LAUNCHER tile.
        disable 'MissingLeanbackLauncher'
    }
    testOptions {
        unitTests.returnDefaultValues = false
    }
}

dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    implementation 'dev.mobile:dadb:1.2.10'
    testImplementation 'junit:junit:4.13.2'
}
