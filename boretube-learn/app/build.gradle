plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// Signed with the TV Guard key, so the two apps can share progress through a
// signature permission (spec §2). The key lives outside git.
def keystoreDir = rootProject.file('../boretube-agent/keystore')
def keystorePropsFile = new File(keystoreDir, 'keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.rakesh.boretube.learn'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rakesh.boretube.learn'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile new File(keystoreDir, keystoreProps['storeFile'].toString().replace('keystore/', ''))
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
    lint {
        // AGP 8.5 lint-vital can't resolve the included learn-core build's jar.
        checkReleaseBuilds false
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.graphicsMode', 'NATIVE'
            systemProperty 'roborazzi.test.record', 'true'
        }
    }
}

dependencies {
    implementation 'com.rakesh.boretube:learn-core:1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'

    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.tv:tv-material:1.0.0'
    implementation 'androidx.activity:activity-compose:1.9.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation platform('androidx.compose:compose-bom:2024.06.00')
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.26.0'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-compose:1.26.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    testImplementation 'androidx.compose.ui:ui-test-manifest'
}
