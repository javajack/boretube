name: boretube_mobile
description: "Boretube — Parental control for Sony Bravia Google TV."
publish_to: 'none'
version: 2.0.1+3

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local storage
  shared_preferences: ^2.3.4

  # CastV2 protobuf runtime
  protobuf: ^4.1.0

  # DIAL HTTP client
  http: ^1.2.0

  # DIAL XML parsing
  xml: ^6.5.0

  # Background service
  flutter_foreground_task: ^8.0.0
  pointycastle: ^4.0.0
  flutter_secure_storage: ^11.2.0
  multicast_dns: ^0.3.3+1
  local_auth: ^3.0.2
  crypto: ^3.0.8
  workmanager: ^0.10.10
  flutter_local_notifications: ^22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/profiles/
    - assets/agent/
    - assets/learn/

  # OFL fonts from github.com/google/fonts (licences in assets/fonts/).
  # Both are variable: FontWeight drives the wght axis.
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Variable.ttf
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Variable.ttf
